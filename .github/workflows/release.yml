name: Release
# Push a version tag (`git tag v0.2.0 && git push origin v0.2.0`) to build binaries and
# attach them to a GitHub release for that tag. Running it by hand (workflow_dispatch)
# builds and packages everything but publishes nothing: a dry run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static (musl), so it runs on any Linux distro regardless of glibc version.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, archive: tar.gz }
          # Raspberry Pi 4/5, ARM VPSes. Cross-compiled with zig as the C toolchain (for
          # zstd-sys); its tests can't run on the x86 runner, so they run on the others.
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, archive: tar.gz, cross: true }
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl') && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cargo-zigbuild
        if: matrix.cross
        run: pip install ziglang cargo-zigbuild
      - if: ${{ !matrix.cross }}
        run: cargo test --release --target ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - if: matrix.cross
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="vxl-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          bin="target/${{ matrix.target }}/release/vxl"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" README.md "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" >/dev/null
            echo "ASSET=$name.zip" >> "$GITHUB_ENV"
          else
            tar czf "$name.tar.gz" "$name"
            echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
