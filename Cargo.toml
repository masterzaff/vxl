[package]
name = "vxl"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
indicatif = "0.18.6"
lz4_flex = "0.14.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh32"] }
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3.27.0"

# Dependencies (zstd, BLAKE3, zlib, LZ4) optimized even in debug builds: tests do real
# compression work and are several times faster, while vxl's own code stays debuggable.
[profile.dev.package."*"]
opt-level = 2
